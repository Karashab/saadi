<style>
:root{color-scheme:light;--card:#fff;--ink:#14213d;--muted:#64708a;--line:#e4e8f1;--accent:#2a5bd7;--bad:#d9433a;--bad-soft:#fde9e7;--band-a:#1f3c88;--band-b:#1a8f9a}
:root[data-theme="dark"]{color-scheme:dark;--card:#161f33;--ink:#e5eaf4;--muted:#94a1ba;--line:#26314a;--accent:#5b8cff;--bad:#ff6b60;--bad-soft:#3d1f22;--band-a:#14275a;--band-b:#0f5e66}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--band-a),var(--band-b));font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);font-size:14px}
.box{width:min(380px,100%);background:var(--card);border-radius:18px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
h1{margin:0 0 4px;font-size:21px;font-weight:800}
p.sub{margin:0 0 20px;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;direction:ltr;text-align:left}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.rem{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
button{width:100%;margin-top:18px;font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{margin-top:12px;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:13px}
.hint{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.8}

<script>
// Shared crypto for the login page, the app, and build.mjs. Plain script: defines NC.
// Users: RSA-OAEP key pair, private key wrapped with PBKDF2(password).
// Data keys (AES-256) are granted per user by RSA encryption; files carry {kid, kv, iv, ct}.
// Roles and company membership are signed (ECDSA P-256) so they cannot be forged by editing data.
var NC = globalThis.NC || (() => {
  const S = crypto.subtle, te = new TextEncoder(), td = new TextDecoder();
  const ITER = 600000;
  const b64 = u => { u = u instanceof Uint8Array ? u : new Uint8Array(u); let s = ''; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const rnd = n => crypto.getRandomValues(new Uint8Array(n));
  const hex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
  const norm = u => String(u || '').trim().toLowerCase();
  const uidOf = async username => hex(await S.digest('SHA-256', te.encode('noor:' + norm(username))));
  const canon = v => v === null || typeof v !== 'object' ? JSON.stringify(v)
    : Array.isArray(v) ? '[' + v.map(canon).join(',') + ']'
    : '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';

  const aes = (raw, use) => S.importKey('raw', raw, 'AES-GCM', false, use);
  async function seal(raw, obj, kid, kv) {
    const iv = rnd(12);
    const ct = await S.encrypt({ name: 'AES-GCM', iv }, await aes(raw, ['encrypt']), te.encode(JSON.stringify(obj)));
    return { kid, kv, iv: b64(iv), ct: b64(ct) };
  }
  async function open(raw, env) {
    const pt = await S.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, await aes(raw, ['decrypt']), unb64(env.ct));
    return JSON.parse(td.decode(pt));
  }
  async function pwKey(password, saltB64, iter, use) {
    const base = await S.importKey('raw', te.encode(password), 'PBKDF2', false, ['deriveKey']);
    return S.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(saltB64), iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, use);
  }
  const RSA = { name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' };

  /** New user entry; private key only ever leaves memory encrypted with the password. */
  async function newEntry(password) {
    const kp = await S.generateKey(RSA, true, ['encrypt', 'decrypt']);
    const priv = new Uint8Array(await S.exportKey('pkcs8', kp.privateKey));
    const s = b64(rnd(16)), i = rnd(12);
    const w = await S.encrypt({ name: 'AES-GCM', iv: i }, await pwKey(password, s, ITER, ['encrypt']), priv);
    return { entry: { s, i: b64(i), it: ITER, w: b64(w), pub: b64(await S.exportKey('spki', kp.publicKey)), g: {} }, priv, privKey: kp.privateKey };
  }
  async function rewrap(entry, privPkcs8, password) {
    const s = b64(rnd(16)), i = rnd(12);
    const w = await S.encrypt({ name: 'AES-GCM', iv: i }, await pwKey(password, s, ITER, ['encrypt']), privPkcs8);
    return { ...entry, s, i: b64(i), it: ITER, w: b64(w) };
  }
  async function unlock(entry, password) {
    const pk = await pwKey(password, entry.s, entry.it || ITER, ['decrypt']);
    const priv = new Uint8Array(await S.decrypt({ name: 'AES-GCM', iv: unb64(entry.i) }, pk, unb64(entry.w)));
    return { priv, privKey: await importPriv(priv) };
  }
  const importPriv = pkcs8 => S.importKey('pkcs8', pkcs8, RSA, false, ['decrypt']);
  async function grant(pubB64, raw) {
    const pub = await S.importKey('spki', unb64(pubB64), RSA, false, ['encrypt']);
    return b64(await S.encrypt({ name: 'RSA-OAEP' }, pub, raw));
  }
  const ungrant = async (privKey, ct) => new Uint8Array(await S.decrypt({ name: 'RSA-OAEP' }, privKey, unb64(ct)));
  /** Decrypts every grant in an entry: { keyId: { version: rawKey } }. */
  async function keysOf(entry, privKey) {
    const out = {};
    for (const [slot, ct] of Object.entries(entry.g || {})) {
      const at = slot.lastIndexOf('@');
      const id = slot.slice(0, at), v = +slot.slice(at + 1);
      try { (out[id] = out[id] || {})[v] = await ungrant(privKey, ct); } catch { /* stale or foreign grant */ }
    }
    return out;
  }

  const EC = { name: 'ECDSA', namedCurve: 'P-256' };
  async function newSigner() {
    const kp = await S.generateKey(EC, true, ['sign', 'verify']);
    return { priv: new Uint8Array(await S.exportKey('pkcs8', kp.privateKey)), pub: b64(await S.exportKey('spki', kp.publicKey)) };
  }
  async function sign(privPkcs8, doc) {
    const k = await S.importKey('pkcs8', privPkcs8, EC, false, ['sign']);
    return b64(await S.sign({ name: 'ECDSA', hash: 'SHA-256' }, k, te.encode(canon(doc))));
  }
  async function verify(pubB64, doc, sig) {
    try {
      const k = await S.importKey('spki', unb64(pubB64), EC, false, ['verify']);
      return await S.verify({ name: 'ECDSA', hash: 'SHA-256' }, k, unb64(sig), te.encode(canon(doc)));
    } catch { return false; }
  }

  /**
   * Trusted access model from the signed organisation document and signed company rosters.
   * Anything that fails verification is ignored, so edited data cannot widen access.
   */
  async function access(rootPub, dir) {
    const org = dir && dir.org && await verify(rootPub, dir.org.doc, dir.org.sig) ? dir.org.doc : null;
    const res = { ok: !!org, companies: {}, supers: new Set(), role: new Map(), company: new Map() };
    if (!org) return res;
    res.companies = org.companies || {};
    for (const uid of Object.keys(org.supers || {})) { res.supers.add(uid); res.role.set(uid, 'super'); }
    for (const [uid, a] of Object.entries(org.admins || {})) if (res.companies[a.cid] && !res.supers.has(uid)) { res.role.set(uid, 'admin'); res.company.set(uid, a.cid); }
    for (const [cid, m] of Object.entries(dir.mem || {})) {
      if (!res.companies[cid] || !m || !m.doc || m.doc.cid !== cid) continue;
      const signer = m.by === 'root' ? rootPub : org.admins && org.admins[m.by] && org.admins[m.by].cid === cid ? org.admins[m.by].sigPub : null;
      if (!signer || !await verify(signer, m.doc, m.sig)) continue;
      for (const [uid, role] of Object.entries(m.doc.members || {}))
        if (!res.role.has(uid) && (role === 'member' || role === 'viewer')) { res.role.set(uid, role); res.company.set(uid, cid); }
    }
    return res;
  }
  /** Who must hold a key, given the trusted model. */
  function holders(model, keyId) {
    const all = [...model.role.keys()];
    const wide = uid => model.supers.has(uid) || (model.companies[model.company.get(uid)] || {}).seesAll;
    if (keyId === 'AK' || keyId === 'DK') return all;
    if (keyId === 'K0') return all.filter(wide);
    if (keyId === 'SIG:root') return [...model.supers];
    if (keyId.startsWith('SIG:')) return model.role.get(keyId.slice(4)) === 'admin' ? [keyId.slice(4)] : [];
    if (keyId.startsWith('C:')) { const cid = keyId.slice(2); return all.filter(u => wide(u) || model.company.get(u) === cid); }
    return [];
  }

  return { ITER, b64, unb64, rnd, norm, uidOf, canon, seal, open, newEntry, rewrap, unlock, importPriv, grant, ungrant, keysOf, newSigner, sign, verify, access, holders };
})();

const $=id=>document.getElementById(id);
const SKEY='noor-s2';
try{localStorage.removeItem('noor-auth');sessionStorage.removeItem('noor-auth')}catch(e){}
const ready=()=>document.readyState==='loading'?new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true})):Promise.resolve();
const pack=s=>JSON.stringify({uid:s.uid,priv:NC.b64(s.priv),pat:s.pat,user:s.user,keys:Object.fromEntries(Object.entries(s.keys).map(([k,vs])=>[k,Object.fromEntries(Object.entries(vs).map(([v,raw])=>[v,NC.b64(raw)]))]))});
const unpack=t=>{const o=JSON.parse(t);return{...o,priv:NC.unb64(o.priv),keys:Object.fromEntries(Object.entries(o.keys).map(([k,vs])=>[k,Object.fromEntries(Object.entries(vs).map(([v,b])=>[v,NC.unb64(b)]))]))}};
function saved(){try{return sessionStorage.getItem(SKEY)||localStorage.getItem(SKEY)}catch(e){return null}}
function forget(){try{sessionStorage.removeItem(SKEY);localStorage.removeItem(SKEY)}catch(e){}}
async function openApp(session){
  const ak=session.keys.AK&&session.keys.AK[APP.kv];if(!ak)throw new Error('no app key');
  const {html}=await NC.open(ak,APP);
  window.NOOR_SESSION=session;window.NOOR_LOGOUT=()=>{forget();try{if(navigator.credentials&&navigator.credentials.preventSilentAccess)navigator.credentials.preventSilentAccess()}catch(e){}location.reload()};
  window.NOOR_REMEMBER=s=>{try{(localStorage.getItem(SKEY)?localStorage:sessionStorage).setItem(SKEY,pack(s))}catch(e){}};
  document.open();document.write(html);document.close();
}
async function registry(){
  const api=NOOR_API+'/repos/'+NOOR_REPO+'/contents/registry.json?ref='+NOOR_BRANCH;
  try{const r=await fetch(api,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
    if(r.ok){const j=await r.json();return JSON.parse(new TextDecoder().decode(NC.unb64(j.content.replace(/\n/g,''))))}}catch(e){}
  if(NOOR_API==='https://api.github.com'){const r=await fetch('https://raw.githubusercontent.com/'+NOOR_REPO+'/'+NOOR_BRANCH+'/registry.json?t='+Date.now(),{cache:'no-store'});if(r.ok)return r.json()}
  throw Object.assign(new Error('net'),{net:true});
}
async function signIn(username,password){
  const reg=await registry();const uid=await NC.uidOf(username);const entry=reg.users[uid];
  if(!entry)throw new Error('bad');
  let u;try{u=await NC.unlock(entry,password)}catch(e){throw new Error('bad')}
  const keys=await NC.keysOf(entry,u.privKey);
  const dk=keys.DK&&keys.DK[reg.dir.kv];if(!dk)throw new Error('bad');
  const dir=await NC.open(dk,reg.dir);
  return{uid,priv:u.priv,keys,pat:dir.pat,user:NC.norm(username)};
}
(async()=>{const s=saved();if(!s||!window.crypto||!crypto.subtle)return;$('f').style.visibility='hidden';await ready();
  try{await openApp(unpack(s))}catch(e){forget();$('f').style.visibility=''}})();
(async()=>{await ready();try{const u=localStorage.getItem('noor-user');if(u&&!$('u').value){$('u').value=u;$('p').focus()}}catch(e){}})();
function err(m){$('e').textContent=m;$('e').hidden=false}
$('f').onsubmit=async ev=>{
  ev.preventDefault();$('e').hidden=true;
  if(!window.crypto||!crypto.subtle){err('این مرورگر پشتیبانی نمی‌شود. لطفاً از نسخه جدید Chrome، Edge یا Safari استفاده کنید.');return}
  $('b').disabled=true;$('b').textContent='در حال بررسی…';
  let s;
  try{s=await signIn($('u').value,$('p').value)}
  catch(x){err(x.net?'ارتباط با سرور برقرار نشد. اینترنت را بررسی کنید و دوباره تلاش کنید.':'نام کاربری یا رمز عبور اشتباه است.');$('b').disabled=false;$('b').textContent='ورود';return}
  try{($('r').checked?localStorage:sessionStorage).setItem(SKEY,pack(s));localStorage.setItem('noor-user',$('u').value.trim())}catch(x){}
  try{if($('r').checked&&window.PasswordCredential&&navigator.credentials)await Promise.race([navigator.credentials.store(new PasswordCredential({id:$('u').value.trim(),password:$('p').value})),new Promise(r=>setTimeout(r,2000))])}catch(x){}
  await openApp(s);
};
