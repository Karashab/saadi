<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ورود · داشبورد پروژه نور</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
:root{color-scheme:light;--bg:#f4f6fb;--card:#fff;--ink:#14213d;--muted:#64708a;--line:#e4e8f1;--accent:#2a5bd7;--bad:#d9433a;--bad-soft:#fde9e7;--band-a:#1f3c88;--band-b:#1a8f9a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1424;--card:#161f33;--ink:#e5eaf4;--muted:#94a1ba;--line:#26314a;--accent:#5b8cff;--bad:#ff6b60;--bad-soft:#3d1f22;--band-a:#14275a;--band-b:#0f5e66}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1424;--card:#161f33;--ink:#e5eaf4;--muted:#94a1ba;--line:#26314a;--accent:#5b8cff;--bad:#ff6b60;--bad-soft:#3d1f22;--band-a:#14275a;--band-b:#0f5e66}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--band-a),var(--band-b));font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);font-size:14px}
.box{width:min(380px,100%);background:var(--card);border-radius:18px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
h1{margin:0 0 4px;font-size:21px;font-weight:800}
p.sub{margin:0 0 20px;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;direction:ltr;text-align:left}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.rem{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
button{width:100%;margin-top:18px;font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{margin-top:12px;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:13px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <h1>داشبورد پروژه نور</h1>
  <p class="sub">برای دیدن داشبورد وارد شوید.</p>
  <label for="u">نام کاربری</label>
  <input type="text" id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">رمز عبور</label>
  <input type="password" id="p" name="password" autocomplete="current-password" required>
  <label class="rem"><input type="checkbox" id="r"> مرا در این دستگاه به خاطر بسپار</label>
  <button id="b" type="submit">ورود</button>
  <div class="err" id="e" hidden></div>
</form>

const S=window.crypto&&crypto.subtle;
async function openPage(raw){
  const k=await S.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const html=new TextDecoder().decode(await S.decrypt({name:'AES-GCM',iv:un(D.iv)},k,un(D.ct)));
  document.open();document.write(html);document.close();
}
function saved(){try{return sessionStorage.getItem('noor-auth')||localStorage.getItem('noor-auth')}catch(e){return null}}

    const base=await S.importKey('raw',enc.encode($('p').value),'PBKDF2',false,['deriveKey']);
    const k=await S.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:un(e.s),iterations:D.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const raw=new Uint8Array(await S.decrypt({name:'AES-GCM',iv:un(e.i)},k,un(e.w)));
    try{(($('r').checked)?localStorage:sessionStorage).setItem('noor-auth',b64(raw))}catch(x){}
    await openPage(raw);
  }catch(x){err('نام کاربری یا رمز عبور اشتباه است.');$('b').disabled=false;$('b').textContent='ورود'}
};
})();
